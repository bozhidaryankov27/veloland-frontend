<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ВелоЛенд - Каталог</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="catalog.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo2.png" alt="Велоленд Лого" />
        </a>
      </div>
      <div class="hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Начало</a></li>
        <li><a href="catalog.html">Каталог</a></li>
        <li><a href="contacts.html">Контакти</a></li>
        <li><a href="author.html">Автор</a></li>
      </ul>
      <div class="shopping-cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count">0</span>
        <div class="cart-dropdown">
          <div class="cart-items-preview"></div>
          <div class="cart-total-preview">
            <p>Обща сума: <span id="cart-total-preview-price">0 €</span></p>
            <button class="checkout-btn">Поръчай</button>
          </div>
        </div>
      </div>
    </nav>

    <section class="catalog">
      <h1>Каталог</h1>

      <div class="catalog-controls">
        <button class="filter-btn" data-category="all">Всички</button>
        <button class="filter-btn" data-category="PREMIUM">Премиум</button>
        <button class="filter-btn" data-category="BEGINNER">Начинаещи</button>
        <button class="filter-btn" data-category="ACCESSORY">Аксесоари</button>
      </div>
      <div class="products" id="products">
        <button class="buy-btn" data-id="${product.id}"></button>
      </div>
    </section>
    <button id="scrollToTopBtn" class="scroll-to-top-btn">↑</button>
    <footer>
      <div class="footer-container">
        <div class="footer-links">
          <a href="index.html">Начало</a>
          <a href="catalog.html">Каталог</a>
          <a href="contacts.html">Контакти</a>
          <a href="author.html">Автор</a>
        </div>
        <ul class="social-links">
          <li>
            <a href="https://www.facebook.com/?locale=bg_BG"
              ><i class="fab fa-facebook-f"></i
            ></a>
          </li>
          <li>
            <a href="https://www.instagram.com/"
              ><i class="fab fa-instagram"></i
            ></a>
          </li>
          <li>
            <a href="https://x.com/home"><i class="fab fa-twitter"></i></a>
          </li>
        </ul>

        <div class="newsletter">
          <p>Абонирай се за нашия бюлетин</p>
          <form action="#" class="newsletter-form">
            <input type="email" placeholder="Вашият e-mail адрес" required />
            <button type="submit">Абониране</button>
          </form>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
    <script src="catalog.js"></script>
  </body>
</html>
